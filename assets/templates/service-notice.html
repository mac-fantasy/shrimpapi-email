<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{notice_title}}</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f4f6f8;color:#172b4d;font-family:Arial,'PingFang SC',sans-serif;">
    <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;background:#fff;">
      <tr><td style="height:5px;background:#ff7a00;"></td></tr>
      <tr><td style="padding:32px;">
        <p style="margin:0 0 24px;color:#ef6c00;font-size:16px;font-weight:bold;">{{product}}</p>
        <p style="margin:0 0 12px;color:#64748b;font-size:12px;">服务通知 · {{notice_type}}</p>
        <h1 style="margin:0 0 20px;font-size:26px;">{{notice_title}}</h1>
        <p style="line-height:1.8;">你好，{{name}}！以下是 {{product}} 的服务安排，请根据业务需要提前做好准备。</p>
        <table role="presentation" style="width:100%;border-collapse:collapse;background:#fff5eb;font-size:14px;line-height:1.8;">
          <tr><td style="padding:12px 16px;color:#64748b;">开始时间</td><td style="padding:12px 16px;">{{start_time}}</td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;">预计结束</td><td style="padding:12px 16px;">{{end_time}}</td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;">影响范围</td><td style="padding:12px 16px;">{{affected_services}}</td></tr>
        </table>
        <h2 style="margin:24px 0 8px;font-size:17px;">可能的影响</h2>
        <p style="line-height:1.8;">{{impact}}</p>
        <h2 style="margin:24px 0 8px;font-size:17px;">建议操作</h2>
        <p style="line-height:1.8;">{{action_required}}</p>
        <p style="margin:28px 0;"><a href="{{status_url}}" style="display:inline-block;padding:12px 24px;background:#172b4d;color:#fff;text-decoration:none;border-radius:6px;">查看服务状态</a></p>
        <p style="line-height:1.8;">感谢你的理解与支持，我们会通过服务状态页同步后续进展。</p>
        <p style="margin:32px 0 0;padding-top:20px;border-top:1px solid #e5eaf0;color:#64748b;font-size:12px;line-height:1.8;">此邮件发送至 {{email}}。如需帮助，请联系 <a href="mailto:{{support_email}}" style="color:#172b4d;">{{support_email}}</a>。</p>
      </td></tr>
    </table>
  </body>
</html>
