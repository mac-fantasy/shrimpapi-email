[package]
name = "shrimpapi-email"
version = "0.2.0"
edition = "2024"
description = "GUI email client for Cloudflare SMTP with per-recipient templates"
rust-version = "1.95"
repository = "https://github.com/mac-fantasy/shrimpapi-email"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["persistence", "accesskit", "default_fonts", "glow", "system_fonts", "clipboard", "links", "x11", "wayland"] }
globset = "0.4"
handlebars = "6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "ring", "webpki-roots"] }
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
